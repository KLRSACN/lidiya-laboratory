name: LCR State + Autonomy Tests

on:
  push:
    branches:
      - lidiya-cloud-relay-v2
    paths:
      - 'missions/LIDIYA-CLOUD-RELAY-V2/**'
      - '.github/workflows/lcr-state-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcr-state-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: missions/LIDIYA-CLOUD-RELAY-V2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile relay, autonomy, activation guard, and metabolism engines
        id: compile
        continue-on-error: true
        run: python -m py_compile cloud_relay_state.py autonomy_signal.py activation_gate_guard.py metabolism/metabolic_cleanup.py

      - name: Run relay, autonomy, activation guard, and metabolism tests
        id: relay_tests
        continue-on-error: true
        env:
          PYTHONPATH: .:metabolism
        run: python -m unittest -v test_cloud_relay_state.py test_autonomy_signal.py test_activation_gate_guard.py metabolism/test_metabolic_cleanup.py

      - name: Compile Step-003 Core v0.2 exact branch sources
        id: core_compile
        continue-on-error: true
        env:
          PYTHONPATH: .:evolution
        run: python -m py_compile evolution/core_v0_2/*.py

      - name: Run Step-003 Core v0.2 independent acceptance tests
        id: core_tests
        continue-on-error: true
        env:
          PYTHONPATH: .:evolution
        run: python -m unittest -v evolution/test_core_v0_2.py evolution/test_affective_store_v0_2.py evolution/test_memory_index_adapter_v0_2.py

      - name: Emit machine-readable evidence
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.relay_tests.outcome }}
          CORE_COMPILE_OUTCOME: ${{ steps.core_compile.outcome }}
          CORE_TEST_OUTCOME: ${{ steps.core_tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          compile_status = os.environ['COMPILE_OUTCOME']
          test_status = os.environ['TEST_OUTCOME']
          core_compile_status = os.environ['CORE_COMPILE_OUTCOME']
          core_test_status = os.environ['CORE_TEST_OUTCOME']
          overall = 'PASS' if all(x == 'success' for x in (
              compile_status, test_status, core_compile_status, core_test_status
          )) else 'FAIL'

          evidence = {
              'schema_version': '1.1',
              'mission_id': 'LCR-EVOLUTION-0005',
              'step_id': 3,
              'evidence_type': 'github_actions_step003_exact_branch_core_v0_2_acceptance',
              'commit_sha': os.environ['COMMIT_SHA'],
              'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'ref': os.environ['GITHUB_REF_VALUE'],
              'ref_name': os.environ['GITHUB_REF_NAME_VALUE'],
              'legacy_compile_status': compile_status,
              'legacy_test_status': test_status,
              'core_compile_command': 'python -m py_compile evolution/core_v0_2/*.py',
              'core_test_command': 'python -m unittest -v evolution/test_core_v0_2.py evolution/test_affective_store_v0_2.py evolution/test_memory_index_adapter_v0_2.py',
              'core_compile_status': core_compile_status,
              'core_test_status': core_test_status,
              'bound_files': {},
              'status': overall,
              'main_modified': False,
              'secret_values_recorded': False,
              'claim_boundary': 'CI executable evidence only; final Step-003 PASS/FAIL/DEFER remains LCR-C authority.'
          }

          bound = [
              'state/MISSION_STATE.json',
              'packets/EVOLUTION-0005-B-TO-C-STEP-003-VERIFY-001.json',
              'evidence/EVOLUTION-0005-STEP-003-BUILDER-001.json',
              'evolution/core_v0_2/memory_model.py',
              'evolution/core_v0_2/affective_store.py',
              'evolution/core_v0_2/reflection_engine.py',
              'evolution/core_v0_2/shadow_runtime.py',
              'evolution/core_v0_2/memory_index_adapter.py',
              'evolution/core_v0_2/MEMORY_FULL_SPECTRUM_CONTRACT.json',
              'evolution/test_core_v0_2.py',
              'evolution/test_affective_store_v0_2.py',
              'evolution/test_memory_index_adapter_v0_2.py',
          ]
          for rel in bound:
              p = Path(rel)
              data = p.read_bytes()
              evidence['bound_files'][rel] = {
                  'git_blob_sha': subprocess.check_output(['git', 'hash-object', rel], text=True).strip(),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size_bytes': len(data),
              }

          path = Path('evidence/step003-core-v02-ci-evidence.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-step003-executable-evidence
          path: missions/LIDIYA-CLOUD-RELAY-V2/evidence/step003-core-v02-ci-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce required checks
        if: always() && (steps.compile.outcome != 'success' || steps.relay_tests.outcome != 'success' || steps.core_compile.outcome != 'success' || steps.core_tests.outcome != 'success')
        run: exit 1

  p0_candidate_regression:
    name: P0 exact-current Gearbox + Always-on candidate regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: missions/LIDIYA-CLOUD-RELAY-V2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact-current P0 candidate sources
        id: p0_compile
        env:
          PYTHONPATH: .:evolution:evolution/local_command_tower
        run: >-
          python -m py_compile
          evolution/gearbox_controller.py
          evolution/gearbox_controller_v2.py
          evolution/gearbox_controller_v2_1.py
          evolution/run_p0_self_test.py
          evolution/local_command_tower/always_on_runtime.py

      - name: Run exact-current timed P0 candidate regressions
        id: p0_tests
        env:
          PYTHONPATH: .:evolution:evolution/local_command_tower
        run: >-
          python evolution/run_p0_self_test.py
          --output evidence/p0-self-test-duration.json
          --slowest-count 10

      - name: Emit P0 candidate evidence
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.p0_compile.outcome }}
          TEST_OUTCOME: ${{ steps.p0_tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          bound = [
              'state/MISSION_STATE.json',
              'evolution/gearbox_controller.py',
              'evolution/test_gearbox_controller.py',
              'evolution/gearbox_controller_v2.py',
              'evolution/test_gearbox_controller_v2.py',
              'evolution/GEARBOX_V2_CONTRACT.json',
              'evolution/gearbox_controller_v2_1.py',
              'evolution/test_gearbox_controller_v2_1.py',
              'evolution/GEARBOX_V2_1_CONTRACT.json',
              'evolution/run_p0_self_test.py',
              'evolution/SELF_TEST_OPTIMIZATION_RESEARCH.json',
              'evolution/local_command_tower/always_on_runtime.py',
              'evolution/local_command_tower/test_always_on_runtime.py',
              'evolution/local_command_tower/ALWAYS_ON_RUNTIME_CONTRACT.json',
          ]
          timing_path = Path('evidence/p0-self-test-duration.json')
          timing = json.loads(timing_path.read_text(encoding='utf-8')) if timing_path.exists() else {
              'status': 'UNAVAILABLE',
              'claim_boundary': 'Timing artifact was not produced; no duration claim is allowed.'
          }
          evidence = {
              'schema_version': '1.1',
              'mission_id': 'LCR-EVOLUTION-0005',
              'evidence_type': 'w01_p0_exact_current_candidate_regression',
              'commit_sha': os.environ['COMMIT_SHA'],
              'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'ref': os.environ['GITHUB_REF_VALUE'],
              'ref_name': os.environ['GITHUB_REF_NAME_VALUE'],
              'compile_status': os.environ['COMPILE_OUTCOME'],
              'test_status': os.environ['TEST_OUTCOME'],
              'status': 'PASS' if os.environ['COMPILE_OUTCOME'] == 'success' and os.environ['TEST_OUTCOME'] == 'success' else 'FAIL',
              'candidate_only': True,
              'formal_c_verification': 'NOT_YET',
              'real_5min_runtime_live': False,
              'p_base': 'READ_ONLY_UNCHANGED',
              'runtime_maintenance_counts_as_experience': False,
              'formal_state_mutation': False,
              'self_test_timing': timing,
              'claim_boundary': 'Exact-current CI executable candidate evidence only. Self-test timing is observational and does not promote Gearbox v2/v2.1, establish real always-on runtime, or replace independent LCR-C verification.',
              'bound_files': {},
          }
          for rel in bound:
              p = Path(rel)
              data = p.read_bytes()
              evidence['bound_files'][rel] = {
                  'git_blob_sha': subprocess.check_output(['git', 'hash-object', rel], text=True).strip(),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size_bytes': len(data),
              }
          path = Path('evidence/p0-exact-current-candidate-regression.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Upload P0 candidate evidence and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-p0-exact-current-candidate-evidence
          path: |
            missions/LIDIYA-CLOUD-RELAY-V2/evidence/p0-exact-current-candidate-regression.json
            missions/LIDIYA-CLOUD-RELAY-V2/evidence/p0-self-test-duration.json
          if-no-files-found: error
          retention-days: 7
