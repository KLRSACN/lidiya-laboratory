name: Agent Runtime Tests

on:
  pull_request:
    branches:
      - foundation/phase2c-v0.4
    paths:
      - "foundation/agent_runtime/**"
      - ".github/workflows/agent-runtime-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-agent-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Confirm no credential inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${LIDIYA_BRIDGE_TOKEN:-}"

      - name: Compile all Agent Runtime modules
        run: python -m compileall -q foundation/agent_runtime

      - name: Run complete unit-test suite
        working-directory: foundation/agent_runtime
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Run isolated demo
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lidiya-agent-runtime"
          python foundation/agent_runtime/agent_runtime.py --root "$root" init
          python foundation/agent_runtime/agent_runtime.py --root "$root" demo
          test -f "$root/runtime.db"

      - name: Confirm sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HOME/.lidiya"
          echo "AGENT_RUNTIME_CI_PASS"

  windows-service-control:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Confirm no credential inputs
        shell: pwsh
        run: |
          if ($env:OPENAI_API_KEY -or $env:GEMINI_API_KEY -or $env:LIDIYA_BRIDGE_TOKEN) {
            throw "Credential input must remain empty"
          }

      - name: Compile all Agent Runtime modules
        shell: pwsh
        run: python -m compileall -q foundation/agent_runtime

      - name: Run complete Windows unit-test suite
        working-directory: foundation/agent_runtime
        shell: pwsh
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Run Windows PID smoke test
        working-directory: foundation/agent_runtime
        shell: pwsh
        run: |
          python -c "import os, service_control; assert service_control._is_running(os.getpid()); assert not service_control._is_running(-1); print('WINDOWS_PID_SMOKE_PASS')"
