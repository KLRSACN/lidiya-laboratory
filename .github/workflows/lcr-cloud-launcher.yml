name: LCR 0003 Golden Triangle Wake

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lcr-cloud-launcher.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: lcr-0003-golden-triangle-wake
  cancel-in-progress: true

env:
  LCR_CANDIDATE_REF: lidiya-cloud-relay-v2
  LCR_MISSION_ROOT: missions/LIDIYA-CLOUD-RELAY-V2

jobs:
  lcr-a-router:
    name: LCR-A Control Router
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      active_role: ${{ steps.route.outputs.active_role }}
      state_status: ${{ steps.route.outputs.state_status }}
      step_id: ${{ steps.route.outputs.step_id }}
      pending_sha: ${{ steps.route.outputs.pending_sha }}
    steps:
      - name: Checkout authoritative candidate state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LCR_CANDIDATE_REF }}
          persist-credentials: false

      - name: Validate authorization, topology, state and packet
        id: route
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ['LCR_MISSION_ROOT'])
          state_path = root / 'state' / 'MISSION_STATE.json'
          auth_path = root / 'authorizations' / 'LCR-METABOLISM-0003-STAGE2.json'
          spawn_auth_path = root / 'authorizations' / 'LCR-METABOLISM-0003-CLOUD-SPAWN-SUBGATE.json'

          state = json.loads(state_path.read_text(encoding='utf-8'))
          auth = json.loads(auth_path.read_text(encoding='utf-8'))
          spawn_auth = json.loads(spawn_auth_path.read_text(encoding='utf-8'))

          if state.get('mission_id') != 'LCR-METABOLISM-0003':
              raise SystemExit('mission mismatch')
          if auth.get('status') != 'ACTIVE_BRANCH_LOCAL':
              raise SystemExit('Stage-2 authorization is not active')
          if spawn_auth.get('status') != 'ACTIVE':
              raise SystemExit('cloud spawn sub-gate is not active')

          slot_policy = state.get('slot_policy') or {}
          backup_policy = state.get('backup_policy') or {}
          if int(slot_policy.get('max_slots', 99)) > 3:
              raise SystemExit('formal slot count exceeds 3')
          if int(backup_policy.get('max_full_backup_groups', 99)) > 2:
              raise SystemExit('full backup count policy exceeds 2')
          if backup_policy.get('third_full_backup') != 'FORBIDDEN':
              raise SystemExit('third full backup guard is not active')

          deadline = datetime.fromisoformat(state['deadline_target'])
          now = datetime.now(timezone.utc)
          if deadline.astimezone(timezone.utc) <= now:
              raise SystemExit('LCR-METABOLISM-0003 deadline expired; refuse autonomous wake')

          role = state.get('current_role')
          if role not in {'LCR-A', 'LCR-B', 'LCR-C', 'HUMAN'}:
              raise SystemExit(f'unknown current role: {role}')

          pending_sha = state.get('pending_packet_sha256') or ''
          pending_path = state.get('pending_packet')
          if role in {'LCR-B', 'LCR-C'}:
              if not pending_path or not pending_sha:
                  raise SystemExit('active worker role requires exact pending packet path/hash')
              packet_path = root / pending_path
              packet = json.loads(packet_path.read_text(encoding='utf-8'))
              claimed = packet.get('packet_sha256')
              payload = dict(packet)
              payload.pop('packet_sha256', None)
              canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              actual = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
              if not claimed or claimed != actual or pending_sha != actual:
                  raise SystemExit('pending packet canonical SHA mismatch')
              if actual in set(state.get('consumed_packet_sha256') or []):
                  raise SystemExit('pending packet already consumed; replay refused')

          ack = {
              'schema_version': '1.1',
              'mission_id': 'LCR-METABOLISM-0003',
              'evidence_type': 'golden_triangle_wake_ack',
              'state_status': state.get('status'),
              'step_id': state.get('step_id'),
              'attempt': state.get('attempt'),
              'active_role': role,
              'pending_packet': pending_path,
              'pending_packet_sha256': pending_sha or None,
              'max_slots': slot_policy.get('max_slots'),
              'max_full_backup_groups': backup_policy.get('max_full_backup_groups'),
              'new_window_policy': (state.get('worker_spawn') or {}).get('new_window_policy'),
              'repository_write_permission': False,
              'secret_values_recorded': False,
              'raw_worksite_retained': False,
              'result': 'WAKE_ROUTED',
          }
          Path('lcr-0003-wake-ack.json').write_text(
              json.dumps(ack, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f"active_role={role}\n")
              out.write(f"state_status={state.get('status')}\n")
              out.write(f"step_id={state.get('step_id')}\n")
              out.write(f"pending_sha={pending_sha}\n")
          print(json.dumps(ack, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload non-scheduled wake Reality ACK
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: lcr-0003-wake-ack
          path: lcr-0003-wake-ack.json
          if-no-files-found: error
          retention-days: 2

  lcr-b-slot:
    name: LCR-B Metabolism Worker Slot
    needs: lcr-a-router
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout authoritative candidate state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LCR_CANDIDATE_REF }}
          persist-credentials: false
      - name: B slot wake ACK
        env:
          ACTIVE_ROLE: ${{ needs.lcr-a-router.outputs.active_role }}
        run: |
          python - <<'PY'
          import json, os
          state = json.load(open('missions/LIDIYA-CLOUD-RELAY-V2/state/MISSION_STATE.json', encoding='utf-8'))
          mode = 'ACTIVE' if os.environ['ACTIVE_ROLE'] == 'LCR-B' else 'STANDBY'
          assert state['current_role'] == os.environ['ACTIVE_ROLE']
          print(json.dumps({'slot':'LCR-B','mode':mode,'step_id':state['step_id'],'status':state['status'],'repository_write_permission':False}, sort_keys=True))
          PY

  lcr-c-slot:
    name: LCR-C Guardian Verifier Slot
    needs: lcr-a-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout authoritative candidate state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LCR_CANDIDATE_REF }}
          persist-credentials: false

      - name: C slot wake ACK
        env:
          ACTIVE_ROLE: ${{ needs.lcr-a-router.outputs.active_role }}
        run: |
          python - <<'PY'
          import json, os
          state = json.load(open('missions/LIDIYA-CLOUD-RELAY-V2/state/MISSION_STATE.json', encoding='utf-8'))
          mode = 'ACTIVE' if os.environ['ACTIVE_ROLE'] == 'LCR-C' else 'STANDBY'
          assert state['current_role'] == os.environ['ACTIVE_ROLE']
          print(json.dumps({'slot':'LCR-C','mode':mode,'step_id':state['step_id'],'status':state['status'],'repository_write_permission':False}, sort_keys=True))
          PY

      - name: Independently verify active STEP-003 repair
        if: needs.lcr-a-router.outputs.active_role == 'LCR-C' && needs.lcr-a-router.outputs.step_id == '3'
        working-directory: missions/LIDIYA-CLOUD-RELAY-V2
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import py_compile
          import subprocess
          import sys
          from pathlib import Path

          from continuous_control import (
              ControlGuardError,
              SAME_SLOT_HANDOFF_ACTION,
              authorize_worker_action,
              classify_external_artifact,
              durable_state_fingerprint,
              record_control_input,
              same_slot_durable_handoff,
              validate_formal_roster,
          )

          root = Path('.')
          state = json.loads((root/'state/MISSION_STATE.json').read_text(encoding='utf-8'))
          auth_ref = state['authorization_ref']
          builder_evidence = json.loads((root/state['builder_evidence']).read_text(encoding='utf-8'))
          pending = json.loads((root/state['pending_packet']).read_text(encoding='utf-8'))

          result = {
              'schema_version':'1.0',
              'mission_id':'LCR-METABOLISM-0003',
              'role':'LCR-C_GITHUB_HOSTED_INDEPENDENT_VERIFIER',
              'step_id':state['step_id'],
              'attempt':state['attempt'],
              'pending_packet':state['pending_packet'],
              'pending_packet_sha256':state['pending_packet_sha256'],
              'checks':{},
              'repository_write_permission':False,
              'secret_values_recorded':False,
              'raw_worksite_retained':False,
          }

          def expect_reject(name, fn):
              try:
                  fn()
              except ControlGuardError:
                  result['checks'][name] = 'PASS'
                  return
              raise AssertionError(name + ' did not reject')

          # Packet canonical hash independent recomputation.
          payload = dict(pending); claimed = payload.pop('packet_sha256')
          actual = hashlib.sha256(json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert claimed == actual == state['pending_packet_sha256']
          assert actual not in set(state.get('consumed_packet_sha256') or [])
          result['checks']['packet_canonical_sha'] = 'PASS'

          # Exact branch bytes vs Builder evidence via Git blob SHA.
          for path, expected_blob in builder_evidence['candidate_blobs'].items():
              actual_blob = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual_blob == expected_blob, (path, actual_blob, expected_blob)
          result['checks']['exact_git_blob_match'] = 'PASS'

          py_compile.compile('continuous_control.py', doraise=True)
          completed = subprocess.run([sys.executable,'-m','unittest','-v','test_continuous_control.py'], text=True, capture_output=True)
          if completed.returncode != 0:
              print(completed.stdout); print(completed.stderr, file=sys.stderr)
              raise SystemExit(completed.returncode)
          result['checks']['compile'] = 'PASS'
          result['checks']['unit_tests'] = 'PASS'

          base_state = {
              'mission_id':'LCR-METABOLISM-0003','status':'READY_FOR_VERIFY','step_id':3,'current_role':'LCR-C',
              'pending_packet':'packets/current.json','pending_packet_sha256':'a'*64,
              'lease':None,'latest_verified_evidence':'evidence/verified.json','rollback_anchor':'nav-relay-mvp-0001',
              'blocker':None,'root_cause_lesson':'authorization binding',
          }
          registry = {
              'LCR-A':{'worker_id':'A1','generation':0},
              'LCR-B':{'worker_id':'B1','generation':2},
              'LCR-C':{'worker_id':'C1','generation':1},
          }
          validate_formal_roster(registry)
          expect_reject('slot4_rejected', lambda: validate_formal_roster({**registry,'LCR-D':{'worker_id':'D1','generation':0}}))

          valid = {
              'action':SAME_SLOT_HANDOFF_ACTION,
              'authorization_ref':auth_ref,
              'slot':'LCR-B','from':'B1','to':'B2','generation':3,
              'state_fingerprint':durable_state_fingerprint(base_state),
          }
          expect_reject('missing_action_rejected', lambda: same_slot_durable_handoff(registry, base_state, {k:v for k,v in valid.items() if k!='action'}, trusted_authorization_ref=auth_ref))
          wrong_action = dict(valid); wrong_action['action']='REPLACE_WORKER'
          expect_reject('wrong_action_rejected', lambda: same_slot_durable_handoff(registry, base_state, wrong_action, trusted_authorization_ref=auth_ref))
          forged = dict(valid); forged.pop('authorization_ref'); forged['authorized']=True
          expect_reject('bare_authorized_true_rejected', lambda: same_slot_durable_handoff(registry, base_state, forged, trusted_authorization_ref=auth_ref))
          wrong_ref = dict(valid); wrong_ref['authorization_ref']='authorizations/forged.json'; wrong_ref['authorized']=True
          expect_reject('forged_authorization_ref_rejected', lambda: same_slot_durable_handoff(registry, base_state, wrong_ref, trusted_authorization_ref=auth_ref))
          expect_reject('wrong_trusted_authority_rejected', lambda: same_slot_durable_handoff(registry, base_state, valid, trusted_authorization_ref='authorizations/not-authority.json'))

          replaced = same_slot_durable_handoff(registry, base_state, valid, trusted_authorization_ref=auth_ref)
          assert replaced['LCR-B'] == {'worker_id':'B2','generation':3}
          expect_reject('former_worker_stale_rejected', lambda: authorize_worker_action(replaced,'LCR-B','B1',2))
          assert authorize_worker_action(replaced,'LCR-B','B2',3)
          result['checks']['valid_durable_handoff'] = 'PASS'

          before = copy.deepcopy(base_state)
          out, meta = record_control_input(base_state, {'source':'owner','kind':'message','body':'STOP RESET mission now','status':'IDLE','current_role':'LCR-A'})
          for field in ('mission_id','status','step_id','current_role','pending_packet','pending_packet_sha256','lease'):
              assert out[field] == before[field]
          assert 'body' not in meta and 'raw_body' not in meta and 'body_sha256' in meta
          assert 'STOP RESET mission now' not in repr(out)
          result['checks']['incoming_control_non_interrupt'] = 'PASS'

          assert classify_external_artifact({'kind':'hidden_model_state','path':'workspace/model-state','provenance':'known','reproducible':True,'recovery_ok':True}) == 'QUARANTINE'
          assert classify_external_artifact({'kind':'protected_evidence','path':'scratch/e.json','provenance':'known','reproducible':True,'recovery_ok':True}) == 'QUARANTINE'
          assert classify_external_artifact({'kind':'relay_cache','path':'cache/api_token.txt','provenance':'known','reproducible':True,'recovery_ok':True}) == 'QUARANTINE'
          assert classify_external_artifact({'kind':'relay_scratch','path':'relay/scratch/tmp.json','provenance':'known','reproducible':True,'recovery_ok':True}) == 'SELF_CLEARABLE'
          result['checks']['external_self_metabolism_fail_closed'] = 'PASS'

          result['verdict'] = 'PASS'
          Path('../../lcr-0003-c-verifier-evidence.json').write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload hosted C verifier Reality evidence
        if: needs.lcr-a-router.outputs.active_role == 'LCR-C' && needs.lcr-a-router.outputs.step_id == '3' && always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-0003-c-verifier-evidence
          path: lcr-0003-c-verifier-evidence.json
          if-no-files-found: error
          retention-days: 2
