name: LCR 0003 Dormant Golden Triangle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcr-0003-dormant
  cancel-in-progress: true

jobs:
  dormant-status:
    name: LCR 0003 Dormancy Guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lidiya-cloud-relay-v2
          persist-credentials: false
      - name: Read closed mission without reactivating it
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('missions/LIDIYA-CLOUD-RELAY-V2')
          state = json.loads((root/'state/MISSION_STATE.json').read_text(encoding='utf-8'))
          stage2 = json.loads((root/'authorizations/LCR-METABOLISM-0003-STAGE2.json').read_text(encoding='utf-8'))
          spawn = json.loads((root/'authorizations/LCR-METABOLISM-0003-CLOUD-SPAWN-SUBGATE.json').read_text(encoding='utf-8'))
          print(json.dumps({
            'mission_id': state.get('mission_id'),
            'state': state.get('status'),
            'mission_result': state.get('mission_result'),
            'current_role': state.get('current_role'),
            'next_authorized_mission': state.get('next_authorized_mission'),
            'stage2_authorization_status': stage2.get('status'),
            'cloud_spawn_subgate_status': spawn.get('status'),
            'formal_slots': (state.get('slot_policy') or {}).get('formal_slots'),
            'repository_write_permission': False,
            'action': 'OBSERVE_ONLY_NO_REACTIVATION'
          }, ensure_ascii=False, sort_keys=True))
          PY
