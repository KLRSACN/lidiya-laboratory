name: LCR Cloud Launcher — Dormant After Verified Proof

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  authorization-gate:
    name: One-time authorization guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout canonical candidate branch
        uses: actions/checkout@v4
        with:
          ref: lidiya-cloud-relay-v2

      - name: Refuse consumed authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('missions/LIDIYA-CLOUD-RELAY-V2/authorizations/LCR-AUTONOMY-0002-ACTIVATION-GATE-20260811.json')
          auth = json.loads(path.read_text(encoding='utf-8'))

          assert auth['mission_id'] == 'LCR-AUTONOMY-0002'
          assert auth['authorization_type'] == 'ONE_TIME_ACTIVATION_GATE'
          if auth.get('status') != 'ACTIVE':
              raise SystemExit(
                  'LCR-AUTONOMY-0002 one-time Activation Gate is consumed. '
                  'A new explicit authorization and reviewed launcher revision are required before another cloud mission.'
              )

          raise SystemExit(
              'Authorization is ACTIVE but this post-proof launcher is intentionally dormant. '
              'A reviewed mission-specific launcher revision is required before execution.'
          )
PY
