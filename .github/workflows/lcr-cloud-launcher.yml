name: LCR Cloud Activation Proof

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lcr-cloud-launcher.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: lcr-cloud-activation-proof
  cancel-in-progress: false

jobs:
  lcr-a-start:
    name: LCR-A Coordinator Start
    if: github.event_name != 'pull_request' || github.head_ref == 'lidiya-cloud-relay-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: lidiya-cloud-relay-v2

      - name: Validate one-time authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('missions/LIDIYA-CLOUD-RELAY-V2/authorizations/LCR-AUTONOMY-0002-ACTIVATION-GATE-20260811.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['mission_id'] == 'LCR-AUTONOMY-0002'
          assert data['authorization_type'] == 'ONE_TIME_ACTIVATION_GATE'
          assert '.github/workflows/lcr-cloud-launcher.yml' in data['allowed']['default_branch_write_scope']
          assert data['validation_carrier']['pull_request'] == 5
          assert data['validation_carrier']['merge_authorized'] is False
          print('authorization=VALID')
          PY

      - name: LCR-A cloud model authentication proof
        id: model_a
        uses: actions/ai-inference@v2.1.1
        with:
          token: ${{ github.token }}
          model: openai/gpt-4o
          temperature: '0'
          max-completion-tokens: '16'
          system-prompt: 'Return only the requested activation token. Do not add punctuation or explanation.'
          prompt: 'Return exactly LCR-A-CLOUD-READY'

      - name: Validate A model response and emit evidence
        env:
          MODEL_RESPONSE: ${{ steps.model_a.outputs.response }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          content = os.environ['MODEL_RESPONSE'].strip()
          if content != 'LCR-A-CLOUD-READY':
              raise SystemExit(f'unexpected coordinator model response: {content!r}')
          evidence = {
              'schema_version': '1.0',
              'mission_id': 'LCR-AUTONOMY-0002',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'role': 'LCR-A',
              'result': 'COORDINATOR_READY',
              'model_auth': 'GITHUB_TOKEN/models:read',
              'model': 'openai/gpt-4o',
              'model_response': content
          }
          Path('a-start.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload A evidence
        uses: actions/upload-artifact@v4
        with:
          name: lcr-a-start
          path: a-start.json
          retention-days: 7

  lcr-b:
    name: LCR-B Builder
    needs: lcr-a-start
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download A evidence
        uses: actions/download-artifact@v4
        with:
          name: lcr-a-start
          path: inbound

      - name: Build deterministic candidate
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          a = json.loads(Path('inbound/a-start.json').read_text(encoding='utf-8'))
          assert a['mission_id'] == 'LCR-AUTONOMY-0002'
          assert a['role'] == 'LCR-A'
          assert a['result'] == 'COORDINATOR_READY'
          run_id = os.environ['GITHUB_RUN_ID']
          text = (
              'LCR_CLOUD_ACTIVATION_CANDIDATE\n'
              'mission=LCR-AUTONOMY-0002\n'
              f'run_id={run_id}\n'
              'builder=LCR-B\n'
          )
          Path('candidate.txt').write_text(text, encoding='utf-8')
          sha = hashlib.sha256(text.encode('utf-8')).hexdigest()
          evidence = {
              'schema_version': '1.0',
              'mission_id': 'LCR-AUTONOMY-0002',
              'run_id': run_id,
              'role': 'LCR-B',
              'result': 'BUILT_NOT_VERIFIED',
              'candidate': 'candidate.txt',
              'candidate_sha256': sha,
              'parent_role': 'LCR-A'
          }
          Path('b-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload B candidate
        uses: actions/upload-artifact@v4
        with:
          name: lcr-b-candidate
          path: |
            candidate.txt
            b-evidence.json
          retention-days: 7

  lcr-c:
    name: LCR-C Verifier
    needs: lcr-b
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download B candidate
        uses: actions/download-artifact@v4
        with:
          name: lcr-b-candidate
          path: inbound

      - name: Independently verify Builder artifact
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          evidence = json.loads(Path('inbound/b-evidence.json').read_text(encoding='utf-8'))
          text = Path('inbound/candidate.txt').read_text(encoding='utf-8')
          expected = (
              'LCR_CLOUD_ACTIVATION_CANDIDATE\n'
              'mission=LCR-AUTONOMY-0002\n'
              f"run_id={os.environ['GITHUB_RUN_ID']}\n"
              'builder=LCR-B\n'
          )
          assert evidence['result'] == 'BUILT_NOT_VERIFIED'
          assert text == expected
          actual_sha = hashlib.sha256(text.encode('utf-8')).hexdigest()
          assert actual_sha == evidence['candidate_sha256']
          Path('verified-sha.txt').write_text(actual_sha + '\n', encoding='utf-8')
          print(f'candidate_sha256={actual_sha}')
          PY

      - name: LCR-C independent cloud model authentication proof
        id: model_c
        uses: actions/ai-inference@v2.1.1
        with:
          token: ${{ github.token }}
          model: openai/gpt-4o
          temperature: '0'
          max-completion-tokens: '16'
          system-prompt: 'Return only the requested verification token. Do not add punctuation or explanation.'
          prompt: 'Return exactly LCR-C-MODEL-ONLINE'

      - name: Validate C model response and emit verdict
        env:
          MODEL_RESPONSE: ${{ steps.model_c.outputs.response }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          content = os.environ['MODEL_RESPONSE'].strip()
          if content != 'LCR-C-MODEL-ONLINE':
              raise SystemExit(f'unexpected verifier model response: {content!r}')
          sha = Path('verified-sha.txt').read_text(encoding='utf-8').strip()
          verdict = {
              'schema_version': '1.0',
              'mission_id': 'LCR-AUTONOMY-0002',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'role': 'LCR-C',
              'result': 'VERIFIED_PASS',
              'deterministic_candidate_check': True,
              'candidate_sha256': sha,
              'independent_model_auth': 'GITHUB_TOKEN/models:read',
              'model': 'openai/gpt-4o',
              'model_response': content
          }
          Path('c-verdict.json').write_text(json.dumps(verdict, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload C verdict
        uses: actions/upload-artifact@v4
        with:
          name: lcr-c-verdict
          path: c-verdict.json
          retention-days: 7

  lcr-a-finish:
    name: LCR-A Coordinator Finish
    needs: lcr-c
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download C verdict
        uses: actions/download-artifact@v4
        with:
          name: lcr-c-verdict
          path: inbound

      - name: Close cloud roundtrip proof
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          c = json.loads(Path('inbound/c-verdict.json').read_text(encoding='utf-8'))
          assert c['mission_id'] == 'LCR-AUTONOMY-0002'
          assert c['role'] == 'LCR-C'
          assert c['result'] == 'VERIFIED_PASS'
          assert c['deterministic_candidate_check'] is True
          result = {
              'schema_version': '1.0',
              'mission_id': 'LCR-AUTONOMY-0002',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'role_chain': ['LCR-A', 'LCR-B', 'LCR-C', 'LCR-A'],
              'builder_verifier_separated': True,
              'cloud_model_auth_verified': True,
              'cloud_model_auth_method': 'GitHub Models via actions/ai-inference and ephemeral GITHUB_TOKEN with models: read',
              'candidate_sha256': c['candidate_sha256'],
              'result': 'PASS',
              'completion_claim': 'CLOUD_A_B_C_A_ROUNDTRIP_VERIFIED',
              'secret_value_recorded': False,
              'main_write_scope': '.github/workflows/lcr-cloud-launcher.yml'
          }
          Path('lcr-cloud-roundtrip.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload final cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: lcr-cloud-roundtrip-evidence
          path: lcr-cloud-roundtrip.json
          retention-days: 14
