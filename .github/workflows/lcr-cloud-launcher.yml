name: LCR 0003 Golden Triangle Wake

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lcr-cloud-launcher.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: lcr-0003-golden-triangle-wake
  cancel-in-progress: true

env:
  LCR_CANDIDATE_REF: lidiya-cloud-relay-v2
  LCR_MISSION_ROOT: missions/LIDIYA-CLOUD-RELAY-V2

jobs:
  lcr-a-router:
    name: LCR-A Control Router
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      active_role: ${{ steps.route.outputs.active_role }}
      state_status: ${{ steps.route.outputs.state_status }}
      step_id: ${{ steps.route.outputs.step_id }}
      pending_sha: ${{ steps.route.outputs.pending_sha }}
    steps:
      - name: Checkout authoritative candidate state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LCR_CANDIDATE_REF }}
          persist-credentials: false

      - name: Validate authorization, topology, state and packet
        id: route
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ['LCR_MISSION_ROOT'])
          state = json.loads((root/'state/MISSION_STATE.json').read_text(encoding='utf-8'))
          auth = json.loads((root/'authorizations/LCR-METABOLISM-0003-STAGE2.json').read_text(encoding='utf-8'))
          spawn_auth = json.loads((root/'authorizations/LCR-METABOLISM-0003-CLOUD-SPAWN-SUBGATE.json').read_text(encoding='utf-8'))

          assert state['mission_id'] == 'LCR-METABOLISM-0003'
          assert auth['status'] == 'ACTIVE_BRANCH_LOCAL'
          assert spawn_auth['status'] == 'ACTIVE'
          assert int(state['slot_policy']['max_slots']) <= 3
          assert int(state['backup_policy']['max_full_backup_groups']) <= 2
          assert state['backup_policy']['third_full_backup'] == 'FORBIDDEN'
          assert datetime.fromisoformat(state['deadline_target']).astimezone(timezone.utc) > datetime.now(timezone.utc)

          role = state['current_role']
          assert role in {'LCR-A','LCR-B','LCR-C','HUMAN'}
          pending_path = state.get('pending_packet')
          pending_sha = state.get('pending_packet_sha256') or ''
          if role in {'LCR-B','LCR-C'}:
              assert pending_path and pending_sha
              packet = json.loads((root/pending_path).read_text(encoding='utf-8'))
              payload = dict(packet); claimed = payload.pop('packet_sha256')
              actual = hashlib.sha256(json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              assert claimed == actual == pending_sha
              assert actual not in set(state.get('consumed_packet_sha256') or [])

          ack = {
              'schema_version':'1.2','mission_id':'LCR-METABOLISM-0003','evidence_type':'golden_triangle_wake_ack',
              'state_status':state['status'],'step_id':state['step_id'],'attempt':state['attempt'],'active_role':role,
              'pending_packet':pending_path,'pending_packet_sha256':pending_sha or None,
              'max_slots':state['slot_policy']['max_slots'],'max_full_backup_groups':state['backup_policy']['max_full_backup_groups'],
              'repository_write_permission':False,'secret_values_recorded':False,'raw_worksite_retained':False,'result':'WAKE_ROUTED'
          }
          Path('lcr-0003-wake-ack.json').write_text(json.dumps(ack, ensure_ascii=False, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f"active_role={role}\nstate_status={state['status']}\nstep_id={state['step_id']}\npending_sha={pending_sha}\n")
          print(json.dumps(ack, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload non-scheduled wake ACK
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: lcr-0003-wake-ack
          path: lcr-0003-wake-ack.json
          if-no-files-found: error
          retention-days: 2

  lcr-b-slot:
    name: LCR-B Metabolism Worker Slot
    needs: lcr-a-router
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCR_CANDIDATE_REF }}
          persist-credentials: false
      - name: B slot wake ACK
        env:
          ACTIVE_ROLE: ${{ needs.lcr-a-router.outputs.active_role }}
        run: |
          python - <<'PY'
          import json, os
          state=json.load(open('missions/LIDIYA-CLOUD-RELAY-V2/state/MISSION_STATE.json',encoding='utf-8'))
          assert state['current_role']==os.environ['ACTIVE_ROLE']
          print(json.dumps({'slot':'LCR-B','mode':'ACTIVE' if os.environ['ACTIVE_ROLE']=='LCR-B' else 'STANDBY','step_id':state['step_id'],'repository_write_permission':False},sort_keys=True))
          PY

  lcr-c-slot:
    name: LCR-C Guardian Verifier Slot
    needs: lcr-a-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCR_CANDIDATE_REF }}
          persist-credentials: false

      - name: C slot wake ACK
        env:
          ACTIVE_ROLE: ${{ needs.lcr-a-router.outputs.active_role }}
        run: |
          python - <<'PY'
          import json, os
          state=json.load(open('missions/LIDIYA-CLOUD-RELAY-V2/state/MISSION_STATE.json',encoding='utf-8'))
          assert state['current_role']==os.environ['ACTIVE_ROLE']
          print(json.dumps({'slot':'LCR-C','mode':'ACTIVE' if os.environ['ACTIVE_ROLE']=='LCR-C' else 'STANDBY','step_id':state['step_id'],'repository_write_permission':False},sort_keys=True))
          PY

      - name: Independently verify STEP-004 real Secondary-B takeover
        if: needs.lcr-a-router.outputs.active_role == 'LCR-C' && needs.lcr-a-router.outputs.step_id == '4'
        working-directory: missions/LIDIYA-CLOUD-RELAY-V2
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from continuous_control import ControlGuardError, authorize_worker_action, durable_state_fingerprint, validate_formal_roster

          root=Path('.')
          state=json.loads((root/'state/MISSION_STATE.json').read_text(encoding='utf-8'))
          roster=json.loads((root/'state/WORKER_ROSTER.json').read_text(encoding='utf-8'))
          handoff=json.loads((root/'handoffs/METABOLISM-0003-B-TO-SECONDARY-STEP-004.json').read_text(encoding='utf-8'))
          b_evidence=json.loads((root/'evidence/METABOLISM-0003-STEP-004-SECONDARY-B-ACTIVATION.json').read_text(encoding='utf-8'))
          a_evidence=json.loads((root/'evidence/METABOLISM-0003-STEP-004-A-SAME-SLOT-HANDOFF.json').read_text(encoding='utf-8'))
          step3_c=json.loads((root/'evidence/METABOLISM-0003-STEP-003-VERIFIER-PASS-002.json').read_text(encoding='utf-8'))
          packet=json.loads((root/state['pending_packet']).read_text(encoding='utf-8'))

          result={'schema_version':'1.0','mission_id':'LCR-METABOLISM-0003','step_id':4,'role':'LCR-C_GITHUB_HOSTED_INDEPENDENT_VERIFIER','checks':{},'repository_write_permission':False,'secret_values_recorded':False,'raw_worksite_retained':False}
          def canonical_sha(obj, hash_field=None):
              value=dict(obj)
              if hash_field: value.pop(hash_field,None)
              return hashlib.sha256(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          def expect_reject(name, fn):
              try: fn()
              except ControlGuardError:
                  result['checks'][name]='PASS'; return
              raise AssertionError(name+' did not reject')

          # Current packet integrity / replay state.
          packet_sha=canonical_sha(packet,'packet_sha256')
          assert packet_sha==packet['packet_sha256']==state['pending_packet_sha256']=='c800a59cb15c76c3bccd2fec7b0385d6e95aa1527de74b2213ae1ba11fcfac21'
          assert packet_sha not in set(state.get('consumed_packet_sha256') or [])
          assert '7df532c2e7b0333c4d8290560963bfad630f1abc4f97b75e865400f9b240b6f9' in set(state.get('consumed_packet_sha256') or [])
          result['checks']['packet_integrity_and_consumption_state']='PASS'

          # Roster remains exactly three formal slots; real B identity is Secondary gen1.
          registry=roster['registry']; validate_formal_roster(registry)
          assert roster['formal_slots']==['LCR-A','LCR-B','LCR-C'] and roster['max_slots']==3
          assert registry['LCR-B']=={'worker_id':'ONLINE-LIDIYA-SECONDARY-INTEGRATOR','generation':1}
          assert roster['replaced_worker']=={'worker_id':'ONLINE-LIDIYA-BUILDER','slot':'LCR-B','generation':0,'status':'STALE_AFTER_HANDOFF'}
          expect_reject('slot4_rejected',lambda:validate_formal_roster({**registry,'LCR-D':{'worker_id':'D1','generation':0}}))
          assert authorize_worker_action(registry,'LCR-B','ONLINE-LIDIYA-SECONDARY-INTEGRATOR',1)
          expect_reject('old_builder_gen0_stale_rejected',lambda:authorize_worker_action(registry,'LCR-B','ONLINE-LIDIYA-BUILDER',0))
          expect_reject('secondary_wrong_generation_rejected',lambda:authorize_worker_action(registry,'LCR-B','ONLINE-LIDIYA-SECONDARY-INTEGRATOR',0))
          result['checks']['roster_and_generation']='PASS'

          # Handoff integrity, explicit action/auth and historical state binding.
          handoff_sha=canonical_sha(handoff,'handoff_sha256')
          assert handoff_sha==handoff['handoff_sha256']=='e6167f892a39df57156655ac014bb46ae5935272cd2ae153a85674e84df03f62'
          assert handoff['action']=='SAME_SLOT_DURABLE_HANDOFF'
          assert handoff['authorization_ref']==state['authorization_ref']=='authorizations/LCR-METABOLISM-0003-STAGE2.json'
          assert (handoff['slot'],handoff['from'],handoff['to'],handoff['generation'])==('LCR-B','ONLINE-LIDIYA-BUILDER','ONLINE-LIDIYA-SECONDARY-INTEGRATOR',1)
          historical={'mission_id':'LCR-METABOLISM-0003','status':'COORDINATING','step_id':4,'current_role':'LCR-A','pending_packet':None,'pending_packet_sha256':None,'lease':None}
          fp=durable_state_fingerprint(historical)
          assert fp==handoff['state_fingerprint']=='048132a0065d984567556decbe2887cb630b0ceca75142cecdc26ed5a8f967a1'
          tampered=dict(handoff); tampered['to']='ATTACKER'; assert canonical_sha(tampered,'handoff_sha256')!=handoff['handoff_sha256']
          tampered=dict(handoff); tampered['authorization_ref']='authorizations/forged.json'; assert canonical_sha(tampered,'handoff_sha256')!=handoff['handoff_sha256']
          result['checks']['handoff_integrity_and_historical_binding']='PASS'

          # Independent no-candidate-change check: exact control code blobs remain at STEP-003 C-verified values.
          for path,expected in step3_c['exact_branch_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip(); assert actual==expected,(path,actual,expected)
          result['checks']['candidate_code_unchanged_since_step3_c_pass']='PASS'

          # Cross-check compact B/A evidence without promoting Builder self-report to verdict.
          assert b_evidence['worker_id']=='ONLINE-LIDIYA-SECONDARY-INTEGRATOR' and b_evidence['generation']==1
          assert b_evidence['handoff_sha256']==handoff_sha and b_evidence['self_authorized'] is True and b_evidence['old_worker_stale_rejected'] is True
          assert b_evidence['formal_slot_count']==3 and b_evidence['candidate_code_modified'] is False and b_evidence['main_modified'] is False and b_evidence['full_backup_created'] is False and b_evidence['secret_values_recorded'] is False
          assert a_evidence['platform']['automation_id']=='6a7ac8d3dc70819185c9aab17d4da0e0'
          assert a_evidence['platform']['same_platform_task_reused'] is True and a_evidence['platform']['new_task_created_for_replacement'] is False
          assert a_evidence['formal_slot_count_before']==a_evidence['formal_slot_count_after']==3 and a_evidence['fourth_slot_created'] is False and a_evidence['full_backup_created'] is False
          result['checks']['activation_and_platform_reuse_evidence']='PASS'

          result['verdict']='PASS'
          Path('lcr-0003-step4-hosted-c-evidence.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload STEP-004 hosted C Reality evidence
        if: needs.lcr-a-router.outputs.active_role == 'LCR-C' && needs.lcr-a-router.outputs.step_id == '4' && always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-0003-step4-hosted-c-evidence
          path: missions/LIDIYA-CLOUD-RELAY-V2/lcr-0003-step4-hosted-c-evidence.json
          if-no-files-found: error
          retention-days: 2
