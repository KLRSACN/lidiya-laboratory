name: LCR Quantum Gearbox Signer Shadow

on:
  push:
    branches:
      - lidiya-cloud-relay-v2
    paths:
      - 'missions/LIDIYA-CLOUD-RELAY-V2/evolution/core_v0_2/quantum_candidates/gearbox_authority_experience_signer_shadow_v01.py'
      - 'missions/LIDIYA-CLOUD-RELAY-V2/evolution/core_v0_2/quantum_candidates/test_gearbox_authority_experience_signer_shadow_v01.py'
      - 'missions/LIDIYA-CLOUD-RELAY-V2/evolution/core_v0_2/quantum_candidates/GEARBOX_AUTHORITY_EXPERIENCE_SIGNER_SHADOW_V01_CONTRACT.json'
      - 'missions/LIDIYA-CLOUD-RELAY-V2/evolution/core_v0_2/quantum_candidates/gearbox_clock_epoch_recovery_shadow_v03.py'
      - 'missions/LIDIYA-CLOUD-RELAY-V2/evolution/core_v0_2/quantum_candidates/test_gearbox_clock_epoch_recovery_shadow_v03.py'
      - 'missions/LIDIYA-CLOUD-RELAY-V2/evolution/core_v0_2/quantum_candidates/GEARBOX_CLOCK_EPOCH_RECOVERY_SHADOW_V03_CONTRACT.json'
      - '.github/workflows/lcr-quantum-gearbox-signer-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcr-quantum-gearbox-signer-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signer_shadow:
    name: Non-formal signer and clock-epoch recovery shadow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: missions/LIDIYA-CLOUD-RELAY-V2
    env:
      PYTHONPATH: ${{ github.workspace }}/missions/LIDIYA-CLOUD-RELAY-V2/evolution:${{ github.workspace }}/missions/LIDIYA-CLOUD-RELAY-V2/evolution/core_v0_2/quantum_candidates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import and compile signer/recovery boundaries
        id: compile_shadow
        run: |
          python - <<'PY'
          import gearbox_authority_experience_signer_shadow_v01
          import gearbox_clock_epoch_recovery_shadow_v03
          print('SIGNER_CLOCK_RECOVERY_IMPORT_PASS')
          PY
          python -m py_compile \
            evolution/core_v0_2/quantum_candidates/gearbox_authority_experience_signer_shadow_v01.py \
            evolution/core_v0_2/quantum_candidates/test_gearbox_authority_experience_signer_shadow_v01.py \
            evolution/core_v0_2/quantum_candidates/gearbox_clock_epoch_recovery_shadow_v03.py \
            evolution/core_v0_2/quantum_candidates/test_gearbox_clock_epoch_recovery_shadow_v03.py

      - name: Run signer boundary adversarial regression
        id: signer_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python evolution/core_v0_2/quantum_candidates/test_gearbox_authority_experience_signer_shadow_v01.py 2>&1 | tee /tmp/gearbox-signer-shadow.log

      - name: Run authenticated clock epoch recovery regression
        id: clock_epoch_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python evolution/core_v0_2/quantum_candidates/test_gearbox_clock_epoch_recovery_shadow_v03.py 2>&1 | tee /tmp/gearbox-clock-epoch-recovery-shadow.log

      - name: Emit bounded signer/recovery evidence
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile_shadow.outcome }}
          SIGNER_TEST_OUTCOME: ${{ steps.signer_tests.outcome }}
          CLOCK_EPOCH_TEST_OUTCOME: ${{ steps.clock_epoch_tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          files = [
              'evolution/core_v0_2/quantum_candidates/gearbox_authority_experience_signer_shadow_v01.py',
              'evolution/core_v0_2/quantum_candidates/test_gearbox_authority_experience_signer_shadow_v01.py',
              'evolution/core_v0_2/quantum_candidates/GEARBOX_AUTHORITY_EXPERIENCE_SIGNER_SHADOW_V01_CONTRACT.json',
              'evolution/core_v0_2/quantum_candidates/gearbox_clock_epoch_recovery_shadow_v03.py',
              'evolution/core_v0_2/quantum_candidates/test_gearbox_clock_epoch_recovery_shadow_v03.py',
              'evolution/core_v0_2/quantum_candidates/GEARBOX_CLOCK_EPOCH_RECOVERY_SHADOW_V03_CONTRACT.json',
          ]
          outcomes = {
              'compile': os.environ.get('COMPILE_OUTCOME', 'skipped'),
              'signer': os.environ.get('SIGNER_TEST_OUTCOME', 'skipped'),
              'clock_epoch_recovery': os.environ.get('CLOCK_EPOCH_TEST_OUTCOME', 'skipped'),
          }
          overall = all(v == 'success' for v in outcomes.values())
          evidence = {
              'schema_version': '1.1-shadow',
              'mission_id': 'LCR-EVOLUTION-0005',
              'evidence_type': 'gearbox_signer_and_clock_epoch_recovery_shadow',
              'commit_sha': os.environ['COMMIT_SHA'],
              'ref_name': os.environ['REF_NAME'],
              'status': 'PASS' if overall else 'FAIL',
              'test_outcomes': outcomes,
              'formal_effect': 'NONE',
              'formal_c_verification': 'NOT_CLAIMED',
              'formal_mutation_allowed': False,
              'p_base': 'READ_ONLY_UNCHANGED',
              'real_5min_runtime_live': False,
              'signature_success_counts_as_experience': False,
              'revocation_counts_as_experience': False,
              'clock_recovery_counts_as_experience': False,
              'provider_maintenance_counts_as_experience': False,
              'recovery_appraisal_personality_trauma_relief_delta': 0,
              'stale_secretary_pressure_carryover': False,
              'claim_boundary': 'Synthetic-key/provider executable protocol evidence only; does not prove protected production keys, real HSM/TPM/remote provider independence, physical rollback-domain separation, formal C PASS, or Gearbox promotion.',
              'bound_files': {},
          }
          for rel in files:
              data = Path(rel).read_bytes()
              evidence['bound_files'][rel] = {'sha256': hashlib.sha256(data).hexdigest(), 'size_bytes': len(data)}
          out = Path('evidence/quantum-gearbox-signer-shadow.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Upload signer shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-quantum-gearbox-signer-shadow
          path: missions/LIDIYA-CLOUD-RELAY-V2/evidence/quantum-gearbox-signer-shadow.json
          if-no-files-found: error
          retention-days: 7

      - name: Aggregate signer/recovery verdict
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile_shadow.outcome }}
          SIGNER_TEST_OUTCOME: ${{ steps.signer_tests.outcome }}
          CLOCK_EPOCH_TEST_OUTCOME: ${{ steps.clock_epoch_tests.outcome }}
        run: |
          python - <<'PY'
          import os, sys
          outcomes = {k: os.environ.get(k, 'skipped') for k in ('COMPILE_OUTCOME','SIGNER_TEST_OUTCOME','CLOCK_EPOCH_TEST_OUTCOME')}
          failed = {k:v for k,v in outcomes.items() if v != 'success'}
          if failed:
              print('SIGNER_CLOCK_RECOVERY_AGGREGATE_FAIL', failed)
              sys.exit(1)
          print('SIGNER_CLOCK_RECOVERY_AGGREGATE_PASS')
          PY
