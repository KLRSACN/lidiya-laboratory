name: Lidiya Open Source Radar

on:
  schedule:
    # 08:30 Asia/Taipei every day
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lidiya-open-source-radar
  cancel-in-progress: false

jobs:
  refresh-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update discovery-only radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 foundation/open_source/update_radar.py

      - name: Prepare generated data branch
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp foundation/open_source/LATEST_SNAPSHOT.json "$work/LATEST_SNAPSHOT.json"
          cp foundation/open_source/OPEN_SOURCE_RADAR.md "$work/OPEN_SOURCE_RADAR.md"
          cp foundation/open_source/registry.json "$work/registry.json"
          cp foundation/open_source/EVALUATION_POLICY.md "$work/EVALUATION_POLICY.md"

          git config user.name "lidiya-open-source-radar[bot]"
          git config user.email "lidiya-open-source-radar[bot]@users.noreply.github.com"
          git switch --orphan generated/open-source-radar
          git rm -rf .
          mkdir -p foundation/open_source
          cp "$work"/* foundation/open_source/
          cat > README.md <<'EOF'
          # Generated Lidiya Open Source Radar

          This branch contains generated discovery metadata only.
          It must never contain credentials, private Home documents, executables, models, or installation scripts.
          EOF
          git add README.md foundation/open_source
          git commit -m "refresh open source radar"
          git push --force origin generated/open-source-radar

      - name: Safety notice
        run: |
          echo "Discovery data updated. No tool was downloaded, installed, executed, merged, or published."
